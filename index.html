<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lion of Chess - Play Free Online Chess</title>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #262421; color: #bababa; text-align: center; padding: 10px; }
    h1 { color: #f0d9b5; margin: 15px 0; font-size: 2rem; }
    #board { width: 90%; max-width: 500px; margin: 20px auto; }
    button { background: #81b64c; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 10px; }
    footer { margin-top: 40px; padding: 20px; font-size: 14px; }
    footer a { color: #81b64c; text-decoration: none; margin: 0 10px; }
    #status { margin: 15px 0; font-size: 18px; color: #f0d9b5; min-height: 25px; }
  </style>
</head>
<body>
  <h1>🦁 Lion of Chess</h1>
  <div id="board"></div>
  <div id="status">Your move. Play as White.</div>
  <button onclick="newGame()">New Game</button>
  <footer>
    <a href="/about.html">About</a> |
    <a href="/privacy.html">Privacy Policy</a> |
    <a href="/contact.html">Contact</a>
  </footer>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script>
    var board = null; var game = new Chess(); var $status = $('#status');
    function onDragStart(source, piece) { if (game.game_over()) return false; if (piece.search(/^b/)!== -1) return false; }
    function makeRandomMove() { var possibleMoves = game.moves(); if (game.game_over()) { $status.text('Game Over'); return; } var randomIdx = Math.floor(Math.random() * possibleMoves.length); game.move(possibleMoves[randomIdx]); board.position(game.fen()); updateStatus(); }
    function onDrop(source, target) { var move = game.move({ from: source, to: target, promotion: 'q' }); if (move === null) return 'snapback'; updateStatus(); window.setTimeout(makeRandomMove, 250); }
    function onSnapEnd() { board.position(game.fen()); }
    function updateStatus() { var status = 'Your move'; if (game.in_checkmate()) status = 'You win!'; else if (game.in_draw()) status = 'Draw!'; else if (game.in_check()) status += '. Check!'; $status.text(status); }
    function newGame() { game = new Chess(); board.start(); updateStatus(); }
    board = Chessboard('board', { 
    draggable: true, 
    position: 'start', 
    onDragStart: onDragStart, 
    onDrop: onDrop, 
    onSnapEnd: onSnapEnd,
    pieceTheme: 'images/{piece}.png'
});
  </script>
</body>
</html>
